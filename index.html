<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BXH ARENA｜Management V2 Candidate</title>
<style>:root{--bg:#08090a;--panel:#17181b;--panel2:#1e2023;--border:#2c2e33;--gold:#d9b95c;--neon:#e9ff2e;--metal:#9a9ea6;--white:#f4f5f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:system-ui,sans-serif}.top{padding:18px 16px;border-bottom:2px solid var(--neon);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:2px}.brand b{color:var(--neon)}.account{position:relative}.badge{border:1px solid var(--gold);background:#151515;color:white;border-radius:20px;padding:8px 12px}.menu{position:absolute;right:0;top:46px;width:210px;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;z-index:5}.menu button{width:100%;padding:12px 14px;text-align:left;border:0;border-bottom:1px solid var(--border);background:none;color:white}.menu button:hover{background:var(--panel2)}.hero{padding:18px 14px}.panel{margin:0 auto;max-width:760px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px}.hint{color:var(--metal);font-size:13px}.status{margin-top:14px;padding:12px;border:1px solid var(--border);border-radius:10px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice button{padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);color:white}.choice button.active{border-color:var(--neon);color:var(--neon)}@media(max-width:430px){.choice{grid-template-columns:1fr}}</style></head><body>
<header class="top"><div class="brand">BXH <b>ARENA</b><div style="font-size:10px;color:#999">MANAGEMENT V2 CANDIDATE</div></div><div class="account"><button class="badge" id="account">黑爸　創世者　▾</button><div class="menu" id="menu" hidden><button>介面主題</button><button id="myInterface">我的介面</button><button>返回身分選擇</button><button>登出系統</button></div></div></header>
<main class="hero"><section class="panel"><h2>管理介面 Candidate Preview</h2><p class="hint">這是獨立 Preview，不會修改正式站。請點右上角帳號選單 →「我的介面」。</p><div id="picker" hidden><h3>我的介面</h3><p class="hint">選擇管理介面配置</p><div class="choice"><button data-v="v1">V1<br><small>經典介面</small></button><button data-v="v2">V2<br><small>新版管理介面</small></button></div></div><div class="status" id="status">目前介面：V1</div></section></main>
<script>const account=document.getElementById('account'),menu=document.getElementById('menu'),picker=document.getElementById('picker'),status=document.getElementById('status');let value=localStorage.getItem('bxh:management-interface')==='v2'?'v2':'v1';function draw(){document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===value));status.textContent='目前介面：'+value.toUpperCase();}account.onclick=()=>menu.hidden=!menu.hidden;document.getElementById('myInterface').onclick=()=>{menu.hidden=true;picker.hidden=false;draw()};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{value=b.dataset.v;localStorage.setItem('bxh:management-interface',value);draw()});draw();</script></body></html>
